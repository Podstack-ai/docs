# ============================================================
# SIDEBAR NAVIGATION DATA (data/en/docs/sidebar.yml)
# PURPOSE: Defines the documentation sidebar structure.
#
# The docs have exactly FIVE top-level sections:
#   QuickPod · TrainPod · Inference · CLI · Support
# Everything else (container image catalog, account, billing,
# onboarding, SDK reference) is folded UNDER one of these five.
#
# ITEM PROPERTIES:
# - title: Display name shown in sidebar (required)
# - slug:  URL segment relative to the parent — builds
#          /docs/<parent>/<slug>/. Use for a section's own pages.
# - path:  ABSOLUTE path override — builds /docs/<path>/ and
#          ignores the parent. Use to fold an existing section
#          (e.g. /docs/account/) under a heading without moving files.
# - pages: Array of child items (optional, nested section).
#
# Rendered recursively by layouts/partials/sidebar-item.html.
# Every slug/path below MUST resolve to a page that exists.
# ============================================================

