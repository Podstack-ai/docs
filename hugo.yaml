# ============================================================
# HUGO CONFIGURATION (hugo.yaml)
# PURPOSE: Main configuration file for Hugo static site generator
# 
# KEY SETTINGS:
# - baseURL: Must match GitHub Pages URL including repo name
# - enableGitInfo: False (not needed for this site)
# - defaultContentLanguage: en (English)
# - permalinks.docs: Auto-generate URLs from folder structure
# - outputs.home: HTML, RSS, JSON (for search index)
# - languages: Site title and content directory setup
# 
# FEATURES:
# - Clean URLs without .html extension (uglyURLs: false)
# - Smooth scroll behavior (handled in CSS)
# - Multilingual support structure (ready for additional languages)
# - Search index generation via JSON output
# 
# CONTENT STRUCTURE:
# - Docs pages auto-generate URLs: /docs/:section/:basename/
# - Example: content/en/docs/getting-started/overview.md
#   → URL: /docs/installation/overview/
# 
# RELATED FILES:
# - data/en/docs/sidebar.yml: Navigation structure
# - layouts/index.json: Search index template
# - layouts/_default/single.html: Doc pages
# - layouts/_default/list.html: Section pages (_index.md)
# ============================================================

# CRITICAL for GitHub Pages: Must include repository name in URL
baseURL: https://docs.podstack.ai/

enableGitInfo: false

defaultContentLanguage: en

# Output formats for search and sitemap
outputs:
  home:
    - HTML
    - RSS
    - JSON
    - sitemap

# Sitemap configuration
sitemap:
  changeFreq: weekly
  priority: 0.5
  filename: sitemap.xml

# Clean URL configuration - use file path structure
permalinks:
  docs: /docs/:sections[1:]/:contentbasename/

# Enable clean URLs with trailing slashes
uglyURLs: false
canonifyURLs: false
relativeURLs: false

languages:
  en:
    weight: 1
    languageName: English
    languageCode: en-US
    contentDir: content/en
    title: Podstack Docs
    params:
      description: Modern GPU cloud platform for AI and machine learning workloads

# To omit the Google Analytics script, put a ~ in place of the G-XXXXXXXXXX below.
services:
  googleAnalytics:
    ID: G-XXXXXXXXXX

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true

params:
  description: "Podstack - GPU cloud for AI and machine learning. Prepaid wallet, GPU time billed per second from the hourly rate. Prices in INR for India and USD elsewhere."

  seo:
    keywords: "Podstack, GPU cloud, GPU instances, jobs, OpenAI-compatible inference, api.podstack.ai, ps_live_, endpoints, functions, deploy, reservations, prepaid wallet, per-second GPU billing, Razorpay"
    ogImage: /images/og-image.svg

    # Competitor comparison keywords for rich snippets
    competitorKeywords:
      - "RunPod vs Podstack"
      - "Vast.ai vs Podstack"
      - "Lambda Labs vs Podstack"
      - "CoreWeave vs Podstack"
      - "Paperspace vs Podstack"
      - "Thunder Compute vs Podstack"
      - "Jarvis Labs vs Podstack"
      - "SaladCloud vs Podstack"
      - "Fluidstack vs Podstack"
      - "Tensordock vs Podstack"
      - "better than RunPod"
      - "better than Vast.ai"
      - "cheaper than Lambda Labs"
      - "cheaper than CoreWeave"
      - "best GPU cloud 2025"
      - "top GPU cloud providers"
      - "GPU cloud comparison"
      - "GPU cloud benchmark"

  project:
    # To omit the startYear, put a ~ in its place.
    startYear: 2022
    presentYear: 2025
    github:
      repo: username/repo
    themeColor:
      light: '#EC6107'
      dark: '#15202D'

  author:
    name: Podstack
    url: https://podstack.ai
    email: support@podstack.ai

  # Default keywords for SEO
  keywords:
    - gpu cloud
    - machine learning
    - ai platform
    - inference
    - documentation

  logo:
    image: /images/favicon.ico
    title: Podstack
    subtitle: GPU Cloud Platform

  home:
    heading: Your next
    headingSegment2: Theme
    description: Description
    getStartedPath: docs/

  enableOGXSEO: true # Enable OG and SEO meta tags
  og_image: /images/logo.png # Default OG image for social sharing

  # Custom CSS for color overrides
  custom_css:
    - css/custom-colors.css

menus:
  main:
    - identifier: home
      name: Home
      pre: <i aria-hidden>🏡</i>
      pageRef: /
      weight: 10
    - identifier: docs
      name: Docs
      pre: <i aria-hidden>📖</i>
      pageRef: /docs
      weight: 20
    - identifier: labs
      name: Labs
      pre: <i aria-hidden>🧪</i>
      pageRef: /labs
      weight: 30