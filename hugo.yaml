# ============================================================
# HUGO CONFIGURATION (hugo.yaml)
# PURPOSE: Main configuration file for Hugo static site generator
# 
# KEY SETTINGS:
# - baseURL: Must match GitHub Pages URL including repo name
# - enableGitInfo: true so lastmod comes from git, not 0001-01-01
# - defaultContentLanguage: en (English)
# - permalinks.docs: Auto-generate URLs from folder structure
# - outputs.home: HTML, RSS, JSON (for search index)
# - languages: Site title and content directory setup
# 
# FEATURES:
# - Clean URLs without .html extension (uglyURLs: false)
# - Smooth scroll behavior (handled in CSS)
# - Multilingual support structure (ready for additional languages)
# - Search index generation via JSON output
# 
# CONTENT STRUCTURE:
# - Docs pages auto-generate URLs: /docs/:section/:basename/
# - Example: content/en/docs/getting-started/overview.md
#   → URL: /docs/installation/overview/
# 
# RELATED FILES:
# - data/en/docs/sidebar.yml: Navigation structure
# - layouts/index.json: Search index template
# - layouts/_default/single.html: Doc pages
# - layouts/_default/list.html: Section pages (_index.md)
# ============================================================

# CRITICAL for GitHub Pages: Must include repository name in URL
baseURL: https://docs.podstack.ai/

enableGitInfo: true

# Prefer an explicit date, then the last git commit, then the file time.
frontmatter:
  date:
    - date
    - :git
    - :fileModTime
  lastmod:
    - lastmod
    - :git
    - date
    - :fileModTime

defaultContentLanguage: en

# Agent Markdown copies. Hugo writes each one beside its HTML as index.md.
# scripts/publish-agent-docs.py then moves leaf pages to slug.md, leaves
# section roots as index.md, and writes pages.json, pages.yaml, llms.txt,
# and llms-full.txt. The GitHub Pages workflow runs that script after Hugo.
mediaTypes:
  text/markdown:
    suffixes:
      - md

outputFormats:
  markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true
    isHTML: false
    notAlternative: true

# Output formats for search and sitemap
outputs:
  home:
    - HTML
    - RSS
    - JSON
    - sitemap
  page:
    - HTML
    - markdown
  section:
    - HTML
    - markdown

# Sitemap configuration
sitemap:
  changeFreq: weekly
  priority: 0.5
  filename: sitemap.xml

# Clean URL configuration - use file path structure
permalinks:
  docs: /docs/:sections[1:]/:contentbasename/

# Enable clean URLs with trailing slashes
uglyURLs: false
canonifyURLs: false
relativeURLs: false

languages:
  en:
    weight: 1
    languageName: English
    languageCode: en-US
    contentDir: content/en
    title: Podstack Docs
    params:
      description: "Podstack docs for GPU cloud, jobs, inference, endpoints, functions, deploy, reservations, and the prepaid wallet."

# GA4 property shared with podstack.ai. layouts/partials/analytics.html
# loads it on the home page, section pages, and doc pages, and only runs
# the tag when the hostname is docs.podstack.ai.
services:
  googleAnalytics:
    ID: G-864PRZ0KVJ

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true

params:
  description: "Podstack docs for GPU cloud, jobs, inference, endpoints, functions, deploy, reservations, and the prepaid wallet. GPU time is billed per second. Prices show in INR for India and USD elsewhere."

  seo:
    keywords: "Podstack, GPU cloud, GPU instances, jobs, OpenAI-compatible inference, api.podstack.ai, ps_live_, endpoints, functions, deploy, reservations, prepaid wallet, per-second GPU billing, Razorpay"
    ogImage: /images/og-image.png

    # Competitor comparison keywords for rich snippets
    competitorKeywords:
      - "RunPod vs Podstack"
      - "Vast.ai vs Podstack"
      - "Lambda Labs vs Podstack"
      - "CoreWeave vs Podstack"
      - "Paperspace vs Podstack"
      - "Thunder Compute vs Podstack"
      - "Jarvis Labs vs Podstack"
      - "SaladCloud vs Podstack"
      - "Fluidstack vs Podstack"
      - "Tensordock vs Podstack"
      - "better than RunPod"
      - "better than Vast.ai"
      - "cheaper than Lambda Labs"
      - "cheaper than CoreWeave"
      - "best GPU cloud 2025"
      - "top GPU cloud providers"
      - "GPU cloud comparison"
      - "GPU cloud benchmark"

  project:
    # Founding year is not published. Leave this unset rather than inventing one.
    startYear: ~
    presentYear: 2025
    github:
      repo: username/repo
    themeColor:
      light: '#EC6107'
      dark: '#15202D'

  author:
    name: Podstack
    url: https://podstack.ai
    email: support@podstack.ai

  # Default keywords for SEO
  keywords:
    - gpu cloud
    - machine learning
    - ai platform
    - inference
    - documentation

  logo:
    image: /images/favicon.ico
    title: Podstack
    subtitle: GPU Cloud Platform

  home:
    heading: Podstack Docs
    headingSegment2: ""
    description: "GPU cloud, jobs, inference, and billing."
    getStartedPath: docs/

  enableOGXSEO: true # Enable OG and SEO meta tags
  og_image: /images/og-image.png

  # Custom CSS for color overrides
  custom_css:
    - css/custom-colors.css

menus:
  main:
    - identifier: home
      name: Home
      pre: <i aria-hidden>🏡</i>
      pageRef: /
      weight: 10
    - identifier: docs
      name: Docs
      pre: <i aria-hidden>📖</i>
      pageRef: /docs
      weight: 20